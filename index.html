<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>WebGIS</title>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.1.0/turf.min.js"></script>
<style>
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
  #map{position:absolute;inset:0;}
  .hud{position:absolute;top:10px;left:10px;z-index:5;max-width:min(330px,86vw);}
  .card{background:rgba(255,255,255,.96);backdrop-filter:blur(4px);
        border:1px solid #dfe3e6;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.14);
        overflow:hidden;}
  .hd{padding:11px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;}
  .hd h1{font-size:15px;margin:0;line-height:1.2;color:#16211f;}
  .hd p{font-size:12px;margin:2px 0 0;color:#5c6b67;}
  .hd .tog{margin-left:auto;font-size:18px;color:#5c6b67;transition:transform .2s;}
  .body{padding:0 14px 14px;display:block;max-height:74vh;overflow:auto;}
  .body.hidden{display:none;}
  .sec{margin-top:12px;}
  .sec .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;
        color:#7c8a86;margin:0 0 7px;font-weight:600;}
  .btn3d{width:100%;padding:9px;border:1px solid #0e7c86;border-radius:9px;
        background:#0e7c86;color:#fff;font-size:14px;font-weight:600;cursor:pointer;}
  .btn3d.off{background:#fff;color:#0e7c86;}
  .rowc{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:14px;color:#16211f;}
  .rowc input{width:16px;height:16px;accent-color:#0e7c86;cursor:pointer;flex:none;}
  .rowc .nm{cursor:pointer;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sw{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.15);}
  .cnt{font-size:11px;color:#8a988f;flex:none;}
  .zbtn{border:1px solid #cfd6d3;background:#fff;border-radius:6px;cursor:pointer;
        font-size:13px;line-height:1;padding:3px 7px;color:#5c6b67;flex:none;}
  .zbtn:hover{border-color:#0e7c86;color:#0e7c86;}
  select{width:100%;padding:7px;border:1px solid #cfd6d3;border-radius:8px;font-size:14px;background:#fff;color:#16211f;}
  .tools{display:flex;flex-wrap:wrap;gap:6px;}
  .tbtn{flex:1 1 30%;padding:7px 6px;border:1px solid #cfd6d3;border-radius:8px;
        background:#fff;color:#16211f;font-size:13px;cursor:pointer;}
  .tbtn.on{background:#f59e0b;border-color:#f59e0b;color:#fff;}
  .tbtn.clr{color:#b04a2f;}
  .maplibregl-popup{max-width:300px!important;}
  .pp-title{font-weight:700;font-size:13px;margin-bottom:6px;color:#0e7c86;}
  table.pp{border-collapse:collapse;font-size:12.5px;width:100%;}
  table.pp th{text-align:left;color:#5c6b67;font-weight:600;padding:2px 8px 2px 0;vertical-align:top;white-space:nowrap;}
  table.pp td{color:#16211f;padding:2px 0;word-break:break-word;}
  table.pp td.empty{color:#8a988f;font-style:italic;}
  .readout{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:6;
        background:rgba(20,30,28,.92);color:#fff;padding:8px 14px;border-radius:10px;
        font-size:13px;display:none;max-width:92vw;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  .readout b{color:#ffcf7a;}
  .credit{position:absolute;bottom:0;right:0;z-index:5;font-size:10px;color:#333;
        background:rgba(255,255,255,.7);padding:1px 6px;border-radius:6px 0 0 0;}
  @media (max-width:520px){ .hud{max-width:calc(100vw - 20px);} }
</style>
</head>
<body>
<div id="map"></div>
<div class="hud">
  <div class="card">
    <div class="hd" id="hd">
      <div>
        <h1 id="ttl">WebGIS</h1>
        <p id="sub"></p>
      </div>
      <div class="tog" id="tog">▾</div>
    </div>
    <div class="body" id="panel">
      <div class="sec" id="sec3d">
        <button class="btn3d off" id="b3d">Tampilan 3D</button>
      </div>
      <div class="sec">
        <p class="lbl">Peta dasar</p>
        <select id="bm">
          <option value="osm">OpenStreetMap</option>
          <option value="sat">Citra Satelit</option>
          <option value="topo">Topografi</option>
        </select>
      </div>
      <div class="sec">
        <p class="lbl">Alat ukur</p>
        <div class="tools">
          <button class="tbtn" id="tDist">Jarak</button>
          <button class="tbtn" id="tArea">Luas</button>
          <button class="tbtn" id="tCoord">Koordinat</button>
          <button class="tbtn clr" id="tClear">Hapus</button>
        </div>
      </div>
      <div class="sec">
        <p class="lbl">Layer</p>
        <div id="layers"></div>
      </div>
    </div>
  </div>
</div>
<div class="readout" id="readout"></div>
<div class="credit" id="credit"></div>

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

var bm0 = CONFIG.basemap || "osm";
var base = BASEMAPS[bm0] || BASEMAPS.osm;

var style = {
  version: 8,
  sources: {
    basemap: {type:"raster", tiles:base.tiles, tileSize:256, maxzoom:base.maxzoom,
              attribution:base.attr},
    terrainDEM: {type:"raster-dem", tiles:[TERRAIN_TILES], encoding:"terrarium",

});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}), "top-right");
map.addControl(new maplibregl.ScaleControl({maxWidth:120, unit:"metric"}), "bottom-left");
map.addControl(new maplibregl.GeolocateControl({
  positionOptions:{enableHighAccuracy:true}, trackUserLocation:true, showUserHeading:true
}), "top-right");
map.addControl(new maplibregl.FullscreenControl(), "top-right");
document.getElementById("credit").innerHTML = esc(base.attr) + " · MapLibre";

var clickable = [];
var nameById = {};
var EMPTY = {type:"FeatureCollection", features:[]};

map.on("load", function(){
  try {
    map.addLayer({id:"hillshade", type:"hillshade", source:"terrainDEM",
                  paint:{"hillshade-exaggeration":0.45}});
  } catch(e){}

  CONFIG.layers.forEach(function(L){
    nameById[L.id] = L.name;
    map.addSource(L.id, {type:"geojson", data:L.geojson});
    L._render = [];
    if (L.gtype === 0) {
      var idp = L.id + "__pt";
      map.addLayer({id:idp, type:"circle", source:L.id,
        paint:{"circle-radius":5,"circle-color":L.color,
               "circle-stroke-width":1.3,"circle-stroke-color":"#ffffff"}});
      L._render.push(idp); clickable.push([idp, L.id]);
    } else if (L.gtype === 1) {
      var idl = L.id + "__ln";
      map.addLayer({id:idl, type:"line", source:L.id,
        layout:{"line-cap":"round","line-join":"round"},
        paint:{"line-color":L.color,"line-width":2.6}});
      L._render.push(idl); clickable.push([idl, L.id]);
    } else {
      var idf = L.id + "__fill", ido = L.id + "__out";
      map.addLayer({id:idf, type:"fill", source:L.id,
        paint:{"fill-color":L.color,"fill-opacity":0.35}});
      map.addLayer({id:ido, type:"line", source:L.id,
        paint:{"line-color":L.color,"line-width":1.6}});
      L._render.push(idf, ido); clickable.push([idf, L.id]);
    }
  });

  // --- lapisan untuk alat ukur ---
  map.addSource("m-line", {type:"geojson", data:EMPTY});
  map.addLayer({id:"m-fill", type:"fill", source:"m-line",
    paint:{"fill-color":"#f59e0b","fill-opacity":0.18}});
  map.addLayer({id:"m-ln", type:"line", source:"m-line",
    layout:{"line-cap":"round","line-join":"round"},
    paint:{"line-color":"#f59e0b","line-width":3,"line-dasharray":[2,1.2]}});
  map.addSource("m-pts", {type:"geojson", data:EMPTY});
  map.addLayer({id:"m-pt", type:"circle", source:"m-pts",
    paint:{"circle-radius":4,"circle-color":"#ffffff",
           "circle-stroke-color":"#f59e0b","circle-stroke-width":2}});

  var popup = new maplibregl.Popup({closeButton:true, closeOnClick:true});
  clickable.forEach(function(pair){
    var rid = pair[0], did = pair[1];
    map.on("click", rid, function(e){
      if (measureMode) return;              // saat mengukur, jangan buka atribut
      if (!e.features || !e.features.length) return;
      var p = e.features[0].properties || {};
      var rows = "";
      for (var k in p){
        var v = p[k];
        if (v === null || v === undefined || v === "" || v === "null") continue;
        rows += "<tr><th>"+esc(k)+"</th><td>"+esc(v)+"</td></tr>";
      }
      if (!rows) rows = "<tr><td class='empty'>(tanpa atribut)</td></tr>";
      popup.setLngLat(e.lngLat).setHTML(
        "<div class='pp-title'>"+esc(nameById[did]||"")+"</div><table class='pp'>"+rows+"</table>"
      ).addTo(map);
    });
    map.on("mouseenter", rid, function(){ if(!measureMode) map.getCanvas().style.cursor="pointer"; });
    map.on("mouseleave", rid, function(){ if(!measureMode) map.getCanvas().style.cursor=""; });
  });

  if (CONFIG.bounds){
    try { map.fitBounds(CONFIG.bounds, {padding:50, duration:0, maxZoom:16}); }
    catch(e){}
  }
  buildLayerList();
});

// ---- panel layer + zoom ke layer ----
function buildLayerList(){
  var box = document.getElementById("layers");
  box.innerHTML = "";
  CONFIG.layers.forEach(function(L){
    var row = document.createElement("div");
    row.className = "rowc";
    var cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = true;
    cb.onchange = function(){
      var vis = cb.checked ? "visible" : "none";
      (L._render||[]).forEach(function(rid){
        if (map.getLayer(rid)) map.setLayoutProperty(rid, "visibility", vis);
      });
    };
    var sw = document.createElement("span");
    sw.className = "sw"; sw.style.background = L.color;
    var nm = document.createElement("span");
    nm.className = "nm"; nm.textContent = L.name; nm.title = L.name;
    nm.onclick = function(){ cb.checked = !cb.checked; cb.onchange(); };
    var ct = document.createElement("span"); ct.className = "cnt"; ct.textContent = L.count;
    var zb = document.createElement("button");
    zb.className = "zbtn"; zb.textContent = "⤢"; zb.title = "Zoom ke layer";
    zb.onclick = function(){
      if (L.bounds){ try{ map.fitBounds(L.bounds,{padding:60, maxZoom:17}); }catch(e){} }
    };
    row.appendChild(cb); row.appendChild(sw); row.appendChild(nm);
    row.appendChild(ct); row.appendChild(zb);
    box.appendChild(row);
  });
}

// ---- ganti peta dasar ----
document.getElementById("bm").value = bm0;
document.getElementById("bm").onchange = function(){
  var k = this.value; var b = BASEMAPS[k] || BASEMAPS.osm;

};

var is3D = false;
var b3d = document.getElementById("b3d");
function set3D(on){
  is3D = on;

    try { map.setTerrain({source:"terrainDEM", exaggeration:1.4}); } catch(e){}

}
b3d.onclick = function(){ set3D(!is3D); };
if (!CONFIG.enable3d){ document.getElementById("sec3d").style.display = "none"; }

// ---- ALAT UKUR ----
var measureMode = null;   // 'dist' | 'area' | 'coord' | null
var mCoords = [];
var RO = document.getElementById("readout");

function fmtDist(km){
  return (km < 1) ? (km*1000).toFixed(1) + " m" : km.toFixed(3) + " km";
}
function fmtArea(m2){
  if (m2 < 10000) return m2.toFixed(1) + " m²";
  var ha = m2/10000;
  if (ha < 100) return ha.toFixed(3) + " ha (" + Math.round(m2).toLocaleString("id") + " m²)";
  return (m2/1e6).toFixed(3) + " km² (" + ha.toFixed(1) + " ha)";
}
function hint(){
  if (measureMode === "dist") return "Klik titik-titik untuk mengukur jarak. Tombol Hapus untuk mengulang.";
  if (measureMode === "area") return "Klik ≥3 titik untuk mengukur luas. Tombol Hapus untuk mengulang.";
  if (measureMode === "coord") return "Klik di peta untuk melihat koordinat.";
  return "";
}
function showReadout(html){ RO.innerHTML = html; RO.style.display = "block"; }

function updateMeasure(){
  var pts = {type:"FeatureCollection", features: mCoords.map(function(c){
    return {type:"Feature", geometry:{type:"Point", coordinates:c}}; })};
  if (map.getSource("m-pts")) map.getSource("m-pts").setData(pts);

  var geo = EMPTY;
  if (measureMode === "area" && mCoords.length >= 3){
    geo = {type:"Feature", geometry:{type:"Polygon", coordinates:[mCoords.concat([mCoords[0]])]}};
  } else if (mCoords.length >= 2){
    geo = {type:"Feature", geometry:{type:"LineString", coordinates:mCoords}};
  }
  if (map.getSource("m-line")) map.getSource("m-line").setData(geo);
  refreshReadout();
}
function refreshReadout(){
  if (measureMode === "dist" && mCoords.length >= 2){
    var km = turf.length({type:"Feature",geometry:{type:"LineString",coordinates:mCoords}},{units:"kilometers"});
    showReadout("Jarak: <b>"+fmtDist(km)+"</b>");
  } else if (measureMode === "area" && mCoords.length >= 3){
    var ring = mCoords.concat([mCoords[0]]);
    var a = turf.area({type:"Feature",geometry:{type:"Polygon",coordinates:[ring]}});
    var kel = turf.length({type:"Feature",geometry:{type:"LineString",coordinates:ring}},{units:"kilometers"});
    showReadout("Luas: <b>"+fmtArea(a)+"</b> &nbsp;·&nbsp; Keliling: <b>"+fmtDist(kel)+"</b>");
  } else if (measureMode){
    showReadout(hint());
  } else {
    RO.style.display = "none";
  }
}
function setMode(m){
  measureMode = (measureMode === m) ? null : m;
  ["tDist","tArea","tCoord"].forEach(function(id){ document.getElementById(id).classList.remove("on"); });
  if (measureMode === "dist") document.getElementById("tDist").classList.add("on");
  if (measureMode === "area") document.getElementById("tArea").classList.add("on");
  if (measureMode === "coord") document.getElementById("tCoord").classList.add("on");
  map.getCanvas().style.cursor = measureMode ? "crosshair" : "";
  if (measureMode !== "dist" && measureMode !== "area"){ mCoords = []; updateMeasure(); }
  refreshReadout();
}
document.getElementById("tDist").onclick  = function(){ setMode("dist"); };
document.getElementById("tArea").onclick  = function(){ setMode("area"); };
document.getElementById("tCoord").onclick = function(){ setMode("coord"); };
document.getElementById("tClear").onclick = function(){ mCoords = []; updateMeasure(); };

map.on("click", function(e){
  if (!measureMode) return;
  if (measureMode === "coord"){
    var lat = e.lngLat.lat.toFixed(6), lng = e.lngLat.lng.toFixed(6);
    new maplibregl.Popup().setLngLat(e.lngLat).setHTML(
      "<div class='pp-title'>Koordinat (WGS84)</div><table class='pp'>"+
      "<tr><th>Lintang</th><td>"+lat+"</td></tr>"+
      "<tr><th>Bujur</th><td>"+lng+"</td></tr></table>").addTo(map);
    return;
  }
  mCoords.push([e.lngLat.lng, e.lngLat.lat]);
  updateMeasure();
});

document.getElementById("hd").onclick = function(){
  var p = document.getElementById("panel");
  p.classList.toggle("hidden");
  document.getElementById("tog").style.transform =
    p.classList.contains("hidden") ? "rotate(-90deg)" : "";
};
</script>
